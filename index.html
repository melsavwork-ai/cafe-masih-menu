<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07150e">
<title>کافه مسیح | Café Masih</title>
<style>
:root{--bg:#06120c;--panel:#0c2117;--line:#2d5a43;--cream:#f2ead9;--muted:#b8c7bb;--gold:#c7a66a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at top,#123322 0,#06120c 42%,#030a06 100%);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(ellipse at 10% 10%,transparent 0 50%,#244e38 51% 52%,transparent 53%),radial-gradient(ellipse at 90% 20%,transparent 0 50%,#244e38 51% 52%,transparent 53%);background-size:320px 260px,360px 300px}
header{padding:25px 16px 20px;text-align:center;border-bottom:1px solid #c7a66a55}
.logo{max-width:170px;max-height:95px;object-fit:contain}
h1{font-size:26px;letter-spacing:4px;margin:3px 0}.sub{color:var(--muted);font-size:13px}
.container{max-width:980px;margin:auto;padding:10px 14px 70px}
nav{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:20;padding:9px 0 12px;background:#06120ced;backdrop-filter:blur(10px)}
nav a{color:var(--cream);text-decoration:none;border:1px solid var(--line);background:#0c2117;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:13px}
.section-title{display:flex;align-items:center;gap:12px;margin:27px 0 13px;font-size:21px;font-weight:800}
.section-title:before,.section-title:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold));flex:1}.section-title:after{background:linear-gradient(90deg,var(--gold),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;align-items:center;gap:10px;min-height:105px;padding:8px;background:linear-gradient(135deg,#102a1ef5,#06120cf5);border:1px solid #417153a8;border-radius:14px;box-shadow:0 8px 20px #0003}
.thumb{width:108px;height:84px;flex:0 0 108px;border-radius:10px;background-image:url("menu-sprite-final.jpg");background-size:700% 700%;background-repeat:no-repeat;background-color:#0a1b12}
.info{min-width:0;flex:1}.name{font-size:14px;font-weight:700;line-height:1.7}.price{margin-top:7px;color:#e2c27e;font-size:14px;font-weight:800}
footer{text-align:center;color:#8fa095;font-size:12px;padding:30px 10px}
.admin-toggle{position:fixed;left:14px;bottom:14px;z-index:50;border:1px solid var(--gold);background:#0b2016;color:var(--cream);border-radius:999px;padding:10px 14px;font-family:inherit;box-shadow:0 8px 24px #0008}
.admin{display:none;position:fixed;inset:0;z-index:100;background:#031009f2;backdrop-filter:blur(8px);overflow:auto;padding:22px}
.admin.open{display:block}.admin-box{max-width:760px;margin:20px auto;background:#0b2016;border:1px solid var(--line);border-radius:18px;padding:18px}
.admin-head{display:flex;justify-content:space-between;align-items:center}.admin h2{margin:0}.admin p{color:var(--muted);font-size:12px;line-height:1.8}
.editor-row{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;margin:7px 0}
.editor-row input{width:100%;padding:10px;border-radius:9px;border:1px solid #3b6650;background:#07150e;color:#fff;font-family:inherit}
.btn{border:1px solid var(--line);background:#102a1e;color:#fff;padding:10px 14px;border-radius:10px;font-family:inherit}.btn.primary{border-color:var(--gold);color:#f0d89f}
@media(max-width:620px){.grid{grid-template-columns:1fr}.thumb{width:112px;flex-basis:112px;height:88px}.name{font-size:15px}}
</style>
</head>
<body>
<header>
<img class="logo" src="logo-tiny.jpg" alt="MASIH CAFÉ">
<h1>CAFÉ MASIH</h1><div class="sub">کافه مسیح • منوی آنلاین</div>
</header>
<div class="container">
<nav>
<a href="#espresso">اسپرسو بار</a><a href="#shake">شیک</a><a href="#smoothie">اسموتی</a><a href="#fries">فرایز</a><a href="#hot">بار گرم</a><a href="#panini">پنینی</a>
</nav>
<div id="menu"></div>
<footer>کافه مسیح • منوی آنلاین</footer>
</div>
<button class="admin-toggle" onclick="openAdmin()">⚙️ ویرایش قیمت‌ها</button>
<div class="admin" id="admin"><div class="admin-box">
<div class="admin-head"><h2>مدیریت قیمت‌ها</h2><button class="btn" onclick="closeAdmin()">بستن</button></div>
<p>برای تغییر قیمت همه مشتری‌ها، فقط فایل <b>prices.json</b> را در GitHub ویرایش کن و روی <b>Commit changes</b> بزن. بعد از انتشار، قیمت جدید برای همه نمایش داده می‌شود.</p>
<div id="editor"></div><br><button class="btn primary" onclick="savePrices()">ذخیره قیمت‌ها</button>
</div></div>
<script>
const DATA=[
{id:"espresso",title:"اسپرسو بار",items:[
["دبل ۱۰۰٪ روبوستا",0,0,0],["دبل ۷۰/۳۰",0,1,0],["سینگل",0,2,0],["لته ۱۰۰٪ روبوستا",0,3,0],["لته ۷۰/۳۰",0,4,0],["امریکانو ۱۰۰٪ روبوستا",0,5,0],["امریکانو ۷۰/۳۰",0,6,0],
["کورتادو ۱۰۰٪ روبوستا",0,0,1],["کورتادو ۷۰/۳۰",0,1,1],["کاپوچینو",0,2,1],["موکا ۱۰۰٪ روبوستا",0,3,1],["موکا ۷۰/۳۰",0,4,1],["کارامل ماکیاتو ۱۰۰٪ روبوستا",0,5,1],["کارامل ماکیاتو ۷۰/۳۰",0,6,1]]},
{id:"shake",title:"شیک",items:[["شیک شکلات",0,0,2],["شیک بادام‌زمینی",0,1,2],["شیک موز شکلات",0,2,2],["شیک لوتوس",0,3,2],["شیک توت‌فرنگی وانیل",0,6,2]]},
{id:"smoothie",title:"اسموتی",items:[["شیر موز",0,4,2],["کوک لیون",0,5,2],["انبه توت‌فرنگی بستنی",0,6,2],["معجون ترش",0,0,3],["بلو بنانا",0,1,3],["موهیتو",0,2,3],["رد موهیتو",0,3,3],["خیار سکنجبین",0,4,3],["سانرایز",0,5,3],["ژوال",0,6,3]]},
{id:"fries",title:"فرایز",items:[["سیب‌زمینی",0,0,4],["سیب‌زمینی با پنیر",0,1,4],["سیب‌زمینی ویژه",0,2,4]]},
{id:"hot",title:"بار گرم",items:[["هات چاکلت",0,3,4],["وایت چاکلت",0,4,4],["شیرکاکائو",0,5,4],["هات بنانا",0,6,4],["شیر بیسکوییت",0,0,5],["ماسالا",0,1,5],["چای کرک",0,2,5],["چای انگلیسی",0,3,5],["چای ساده",0,4,5],["چای زعفران",0,5,5],["شیر عسل",0,6,5]]},
{id:"panini",title:"پنینی",items:[["پنینی مرغ",0,0,6],["پنینی ژامبون",0,1,6],["پنینی گوشت",0,2,6]]}
];

const menu=document.getElementById("menu"); let all=[]; let PRICES={};

function render(){
  menu.innerHTML=""; all=[];
  DATA.forEach(sec=>{
    let s=document.createElement("section"); s.id=sec.id;
    s.innerHTML='<div class="section-title"><span>'+sec.title+'</span></div><div class="grid"></div>';
    let g=s.querySelector(".grid");
    sec.items.forEach(x=>{
      let i=all.length; all.push(x);
      let [name,_,c,r]=x; let price=PRICES[name]||0;
      let el=document.createElement("article"); el.className="item";
      el.innerHTML='<div class="thumb" style="background-position:'+(c*16.6667)+'% '+(r*16.6667)+'%"></div><div class="info"><div class="name">'+name+'</div><div class="price" id="p'+i+'">'+(price?Number(price).toLocaleString("fa-IR")+" تومان":"قیمت بعداً اضافه می‌شود")+'</div></div>';
      g.appendChild(el);
    });
    menu.appendChild(s);
  });
}

async function loadPrices(){
  try{
    const r=await fetch("prices.json?t="+Date.now(),{cache:"no-store"});
    PRICES=await r.json();
  }catch(e){PRICES={};}
  render();
}
function openAdmin(){
  let e=document.getElementById("editor"); e.innerHTML="";
  all.forEach((x,i)=>{
    let name=x[0],v=PRICES[name]||"";
    e.innerHTML+='<div class="editor-row"><label>'+name+'</label><input data-name="'+name.replaceAll('"','&quot;')+'" inputmode="numeric" value="'+v+'"></div>';
  });
  document.getElementById("admin").classList.add("open");
}
function closeAdmin(){document.getElementById("admin").classList.remove("open")}
function savePrices(){
  alert("برای تغییر عمومی قیمت، فایل prices.json را در GitHub ویرایش و Commit کن. دکمه ذخیره اینجا فقط برای راهنمایی است.");
}
loadPrices();
</script>
</body>
</html>
